<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI-powered personalized financial news and alerts.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Financial Insights">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Financial Insights</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #E2E8F0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #phone {
      box-sizing: border-box;
      width: 414px;
      height: min(868px, calc(100vh - 72px));
      padding: 12px;
      border-radius: 52px;
      background: #0F172A;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
      background: #F8FAFC;
    }

    #note {
      margin: 0;
      color: #475569;
      font-size: 13px;
    }

    @media (max-width: 500px), (max-height: 600px) {
      body {
        display: block;
      }

      #phone {
        width: 100%;
        height: 100%;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }

      #app {
        border-radius: 0;
      }

      #note {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="phone"><div id="app"></div></div>
  <p id="note">Web demo. Push notifications are in the Android app only.</p>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
